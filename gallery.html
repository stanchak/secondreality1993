<body><div class="crt"><div class="body">

<h1 class="yel">GALLERY <span class="dim">— rendered straight from the release’s data files</span></h1>

<div id="frame" style="text-align:center"></div>

<div class="menu" id="m"></div>
</div></div>
<script type="module">
import { chrome, menu } from './bbs.js';

const ART = [
  ['title',     'BEG — the title painting, faded in from white'],
  ['troll',     'TECHNO — the endcard, held while the next part loads'],
  ['panorama',  'ALKU — the opening panorama, scrolled across a 704px canvas'],
  ['forest',    'MNTSCRL — recovered from a linked object file'],
  ['cred-ship', 'CRED — recovered from the shipped executable'],
  ['cred-city', 'CRED — the dev tree had an unfinished render here'],
];
let i = 0;
const frame = document.getElementById('frame');
function show() {
  const [f, cap] = ART[i];
  frame.innerHTML =
    `<img class="art" src="img/art/${f}.png" alt="${cap}" style="max-width:100%;max-height:60vh">` +
    `<p class="dim">${i + 1}/${ART.length} — ${cap}</p>`;
}
document.getElementById('m').innerHTML = menu([
  { key: 'N', file: '#', title: 'Next picture', desc: 'or press → ' },
  { key: 'P', file: '#', title: 'Previous',     desc: 'or press ←' },
]);
show();
// N/P and the arrows belong to the picture here, not to the board — without
// reserving them the board would also fire the menu row and advance twice.
chrome({ title: 'Gallery', reserve: ['n', 'p', 'ArrowLeft', 'ArrowRight'] });
addEventListener('keydown', e => {
  if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') { i = (i + 1) % ART.length; show(); }
  if (e.key === 'p' || e.key === 'P' || e.key === 'ArrowLeft')  { i = (i + ART.length - 1) % ART.length; show(); }
});
document.querySelectorAll('.menu a').forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  i = (a.dataset.key === 'N' ? i + 1 : i + ART.length - 1) % ART.length; show();
}));
</script></body></html>
